version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-shark-api-dev
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./outputs:/app/outputs
      - ./tests:/app/tests
      - ./task_config.py:/app/task_config.py
    environment:
      - USE_GCS=false
      - OUTPUT_DIR=/app/outputs
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - API_PORT=8000
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ai-shark-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ai-shark-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ai-shark-network
    depends_on:
      - api
    restart: unless-stopped

  # Streamlit (Legacy UI - for comparison)
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-shark-streamlit-dev
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./outputs:/app/outputs
      - ./streamlit_ui.py:/app/streamlit_ui.py
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    command: streamlit run streamlit_ui.py --server.port=8501
    networks:
      - ai-shark-network
    restart: unless-stopped

networks:
  ai-shark-network:
    driver: bridge
