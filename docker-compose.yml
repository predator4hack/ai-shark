version: "3.8"

services:
    # FastAPI Backend
    api:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        container_name: ai-shark-api-dev
        ports:
            - "8000:8000"
        volumes:
            - ./backend/src:/app/src
            - ./backend/config:/app/config
            - ./backend/outputs:/app/outputs
            - ./backend/tests:/app/tests
            - ./backend/task_config.py:/app/task_config.py
        env_file:
            - ./backend/.env
        environment:
            # Override specific vars for dev environment
            - USE_GCS=false
            - OUTPUT_DIR=/app/outputs
            - API_PORT=8000
        command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
        networks:
            - ai-shark-network
        restart: unless-stopped

    # React Frontend
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        container_name: ai-shark-frontend-dev
        ports:
            - "3000:3000"
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
            - ./frontend/index.html:/app/index.html
            # Prevent node_modules from being overwritten
            - /app/node_modules
        environment:
            - VITE_PROXY_TARGET=http://api:8000
        command: npm run dev -- --host 0.0.0.0
        networks:
            - ai-shark-network
        depends_on:
            - api
        restart: unless-stopped

networks:
    ai-shark-network:
        driver: bridge
